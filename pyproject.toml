[project]
name = "contributors"
version = "2.0.0"
description = "GitHub Action that produces information about contributors over a specified time period."
requires-python = ">=3.11"
dependencies = [
    "PyGithub==2.9.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "black==26.10.0",
    "flake8==7.4.1",
    "mypy==2.4.0",
    "mypy-extensions==1.1.0",
    "pylint==4.1.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "types-requests==2.33.0.20260906",
]
